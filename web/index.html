<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1730">
<title>pixelhub</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Design tokens: every component reads these through var(--…). Dark only: the page frames a lit display. */
  :root {
    --bg: #1a1730; --surface: #242040; --case: #0f0d1c; --ink: #f2eeff; --muted: #a59dc6; --line: #363057; --chip: #2e2950;
    --accent: #ffb547; --on-accent: #2a1a00; --ok: #4ad38a; --warn: #ffb547; --bad: #ff6b6b;
    --font-pixel: "Pixelify Sans", "Figtree", system-ui, sans-serif;
    --font-display: var(--font-pixel);
    --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html { padding-top: env(safe-area-inset-top, 0px); background: var(--bg); overflow-x: clip; }
  body { margin: 0; background: radial-gradient(1200px 600px at 50% -200px, #2b2550 0%, transparent 70%), var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); min-height: 100vh; overflow-x: hidden; }
</style>
<script type="module" src="app.js"></script>
</head>
<body>
<pixelhub-app></pixelhub-app>
</body>
</html>
